services:
  db:
    image: postgres:16-alpine
    container_name: bulk_cert_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: certificates
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d certificates"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
